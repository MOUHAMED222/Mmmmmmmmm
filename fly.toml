app = 'odidudidis'
primary_region = 'lax'

[build]
  dockerfile = 'Dockerfile'

[env]
  DOCKER_HOST = 'unix:///var/run/docker.sock'
  USER_DATA_DIR = '/app/user_data'

# مجلد واحد فقط - سيتم استخدامه لتخزين بيانات المستخدمين والحاويات
[[mounts]]
  source = 'user_data'
  destination = '/app/user_data'

[http_service]
  internal_port = 8100
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
  privileged = true   # ضروري لتشغيل Docker daemon داخل الحاوية
