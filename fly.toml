# fly.toml app configuration file generated for mmmmmmmmm on 2026-08-09T18:34:54Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mmmmmmmmm'
primary_region = 'lax'

[build]
  dockerfile = 'Dockerfile'

[env]
  DOCKER_HOST = 'unix:///var/run/docker.sock'
  USER_DATA_DIR = '/app/user_data'

[[mounts]]
  source = 'user_data'
  destination = '/app/user_data'

[http_service]
  internal_port = 8100
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
